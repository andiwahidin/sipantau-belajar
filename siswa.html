<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantauBelajar - Portal Cek Capaian Siswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f4f6f9] text-[#1e293b] min-h-screen flex flex-col">

    <!-- Header Portal Siswa -->
    <header class="bg-white border-b border-slate-200 h-[68px] px-6 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-br from-blue-600 to-sky-400 rounded-lg flex items-center justify-center text-white">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <span class="text-lg font-bold text-slate-900">Pantau<span class="text-blue-600">Belajar</span> <small class="text-xs font-medium text-slate-500 ml-1">Portal Siswa</small></span>
        </div>
        <a href="index.html" class="btn btn-outline text-xs"><i class="fa-solid fa-Chalkboard-user"></i> Login Guru</a>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-3xl w-full mx-auto p-6 flex-1">
        <div class="card-box text-center py-8 px-6 mb-6">
            <h1 class="text-xl font-bold text-slate-900 mb-2">Cek Perkembangan & Kehadiran Belajar</h1>
            <p class="text-xs text-slate-500 mb-5">Masukkan NIS atau Nama Lengkap Anda untuk melihat rekap kehadiran, tugas, dan nilai.</p>
            <div class="flex max-w-md mx-auto gap-2">
                <input type="text" id="inputCariSiswa" placeholder="Masukkan NIS atau Nama Siswa..." class="form-control flex-1">
                <button class="btn btn-primary" onclick="cariProgresSiswa()"><i class="fa-solid fa-magnifying-glass"></i> Cari</button>
            </div>
        </div>

        <!-- Hasil Pencarian Siswa -->
        <div id="hasilSiswaContainer" class="hidden"></div>
    </main>

    <div id="toast" class="hidden"></div>

    <script src="config.js"></script>
    <script src="app-siswa.js"></script>
</body>
</html>
